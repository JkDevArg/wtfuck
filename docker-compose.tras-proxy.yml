# Para un servidor que YA tiene un proxy con TLS: CloudPanel, Plesk, aaPanel,
# o un nginx puesto a mano.
#
# Es el mismo despliegue que `docker-compose.produccion.yml` menos Caddy. Ese
# archivo trae su propio Caddy y quiere los puertos 80 y 443, que en una
# maquina con panel ya son del nginx del panel. Dos cosas no pueden escuchar
# en el mismo puerto, asi que se elige una: la del panel, porque es la que ya
# gestiona los certificados y la que el panel sabe reconfigurar.
#
# Lo que cambia respecto al otro archivo, y nada mas:
#
#   1. No hay Caddy.
#   2. `servidor` y `almacen` publican en 127.0.0.1 — el proxy del anfitrion
#      llega ahi, y nadie de fuera.
#   3. Hace falta `WTFUCK_S3_PUBLICO` (ver `.env.produccion.ejemplo`).
#
# La configuracion del proxy esta en `docs/09-DESPLIEGUE.md`, seccion
# "Detras de un panel". Tiene tres detalles que si se saltan dan fallos que no
# se parecen a su causa; no es relleno.
#
#   docker compose -f docker-compose.tras-proxy.yml up -d

# ATENCION AL --env-file
#
#   docker compose --env-file .env.produccion -f <este archivo> up -d
#
# La bandera NO es opcional. `env_file:` de abajo inyecta variables DENTRO de
# los contenedores, pero las `${VARIABLES}` de este archivo las resuelve
# Compose ANTES, y para eso solo mira `.env` o lo que diga `--env-file`.
#
# Sin la bandera, Compose avisa con un WARN facil de pasar por alto y sigue
# con cadenas vacias: un Postgres sin contrasena y un almacen con credenciales
# en blanco. Por eso cada variable lleva `:?` — asi Compose se PARA con un
# mensaje que dice cual falta, en vez de levantar algo abierto.

name: wtfuck

services:

  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.produccion
    environment:
      WTFUCK_PUERTO: 8300
      WTFUCK_DB_URL: jdbc:postgresql://db:5432/wtfuck
      # El usuario y la CLAVE, que faltaban.
      #
      # `DB_PASS` del .env solo llegaba a Postgres, porque el compose la usa
      # ahi como POSTGRES_PASSWORD. El servidor no lee esa: lee
      # `WTFUCK_DB_PASS`, y sin ella cae a su valor de desarrollo
      # —`wtfuck_dev`— que la base recien creada no reconoce.
      #
      # El sintoma es el peor posible porque suena a otra cosa:
      #
      #   FATAL: password authentication failed for user "wtfuck"
      #
      # Eso se lee como "la contrasena no coincide", y lleva a sospechar del
      # volumen de Postgres —que graba la suya al inicializar y nunca mas— en
      # vez de a una variable que nadie estaba pasando. Borrar el volumen no
      # arregla nada: el servidor sigue mandando la clave de desarrollo.
      WTFUCK_DB_USER: wtfuck
      WTFUCK_DB_PASS: ${DB_PASS:?hace falta --env-file .env.produccion}
      WTFUCK_REDIS_URL: redis://:${REDIS_PASS:?hace falta --env-file .env.produccion}@redis:6379
      # En `true` se aceptan aparatos sin enclave seguro, o sea emuladores, y
      # el vinculo de hardware se salta con cinco minutos de trabajo. Desde el
      # 2026-10-08 `false` es tambien el defecto del servidor; se deja explicita
      # para que se lea. No verifica atestacion: el nivel es el que declara el
      # cliente. Ver docs/04-DEVICE-BINDING.md.
      WTFUCK_PERMITIR_SOFTWARE_DEV: "false"
      # La version web: los archivos que se armaron en la PC y se subieron a
      # ./web-publicada, igual que el APK. Si la carpeta esta vacia, /web
      # responde 404 con el motivo. Ver docs/12-VERSION-WEB.md.
      WTFUCK_WEB_DIR: /app/web
    # Solo lectura: el servidor sirve la web, no la escribe.
    volumes:
      - ./web-publicada:/app/web:ro
    ports:
      # SOLO en la interfaz local. Sin el `127.0.0.1:` delante, Docker abre el
      # puerto en todas las interfaces Y le escribe una regla a iptables que
      # se salta el cortafuegos del anfitrion — o sea que ufw dice que esta
      # cerrado y esta abierto a internet. Es de los errores mas comunes al
      # juntar Docker con un panel, y no avisa.
      - "127.0.0.1:8300:8300"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      almacen:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtfuck
      POSTGRES_PASSWORD: ${DB_PASS:?hace falta --env-file .env.produccion}
      POSTGRES_DB: wtfuck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfuck -d wtfuck"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin `ports`: nadie fuera de esta red la necesita. Un Postgres escuchando
    # en 0.0.0.0 lo encuentra un escaner en horas, no en meses.

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?hace falta --env-file .env.produccion}", "--appendonly", "yes"]
    volumes:
      - redisdatos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:?hace falta --env-file .env.produccion}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------- almacen
  #
  # SeaweedFS y no MinIO, y no por gusto: MinIO retiro la imagen del servidor
  # de los registros publicos. `quay.io/minio/minio` devuelve 401 hasta para
  # consultar el repositorio, `minio/minio` ya no existe en Docker Hub —la
  # organizacion conserva 20 repos y ese no esta— y ni ghcr ni ECR la tienen.
  #
  # Se descubrio de la peor forma posible: funcionando en la maquina de
  # desarrollo, donde la imagen llevaba un ano en cache, y fallando en un
  # servidor nuevo que si tenia que descargarla. Docker no vuelve a bajar lo
  # que ya tiene, asi que un registro que se cierra es invisible hasta que
  # alguien empieza de cero. Es un argumento para fijar versiones y guardar
  # copia de las imagenes de las que uno depende.
  #
  # SeaweedFS habla S3 con firmas SigV4, que es lo unico que esta app le pide
  # a un almacen. Verificado con las 1548 pruebas de integracion, que suben y
  # bajan adjuntos por URL firmada: pasan las mismas que pasaban con MinIO.
  #
  # Las credenciales van en `despliegue/s3.json` —SeaweedFS no las toma por
  # variable de entorno— y las escribe `despliegue/preparar.sh`.
  almacen:
    image: chrislusf/seaweedfs:4.47
    # Fijada, y no `latest`.
    #
    # `latest` significa que el proximo `docker compose pull` puede cambiar el
    # motor de almacenamiento debajo de un despliegue que funciona, sin que
    # nadie lo pida. Ya se vio en esta misma version: la 4.47 empezo a quejarse
    # de una configuracion IAM que antes no pedia -no rompe las credenciales
    # estaticas, pero es exactamente el tipo de cambio que aparece solo-.
    #
    # Para subirla: cambiar el numero aqui, levantar en local, y correr
    # `node pruebas/correr.mjs media historias` antes de tocar el VPS.
    restart: unless-stopped
    command:
      - server
      # `/data` y NO otra ruta: la imagen declara ese path como su volumen y
      # lo deja en propiedad del usuario `seaweed`, que es con el que acaba
      # corriendo el proceso.
      #
      # Con cualquier otra —lo puse en `/datos`— Docker crea el volumen vacio
      # y en propiedad de root, y el arranque muere con
      # `mkdir /datos/m9333: permission denied`. El contenedor sale, nunca
      # llega a healthy, y lo que se ve arriba es al servidor esperandolo:
      # `dependency failed to start: container wtfuck-almacen-1 is unhealthy`.
      # El sintoma senala al chequeo de salud y la causa esta en el montaje.
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - almacen:/data
      - ./despliegue/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      # Solo local. Lo que el telefono alcanza es DOMINIO_MEDIA, que el proxy
      # del anfitrion trae hasta aqui.
      - "127.0.0.1:9000:9000"
    healthcheck:
      # Se comprueba que el S3 CONTESTO con HTTP, no que devolviera 200.
      #
      # Sin credenciales la raiz responde 403, y eso ya demuestra que el
      # servicio esta vivo. El `wget -q -O-` que habia aqui antes daba por
      # muerto al contenedor en ese caso: BusyBox devuelve distinto de cero
      # ante cualquier respuesta de error, asi que el almacen nunca llegaba a
      # `healthy` y el servidor se quedaba esperandolo para siempre.
      #
      # Lo escribi mirando `curl -w "%{http_code}"`, que devuelve 0 pase lo
      # que pase, y de ahi salio la suposicion equivocada.
      #
      # Comprobado en la imagen, en los dos sentidos: da 0 contra el S3 vivo
      # y falla contra un puerto donde no hay nadie. Un chequeo que no puede
      # fallar no comprueba nada.
      test: ["CMD-SHELL", "wget -O- http://127.0.0.1:9000/ 2>&1 | grep -q HTTP"]
      interval: 15s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # `host` y no una red de Docker: coturn reparte los relevos por un rango
    # de puertos UDP y necesita ver la IP publica de verdad. Con NAT de Docker
    # anuncia direcciones que no sirven, y el sintoma es una llamada que se
    # queda conectando para siempre sin ningun error.
    #
    # Esto NO choca con el panel: los paneles no usan 3478 ni el rango de
    # relevos. Lo que si hay que hacer es abrirlos en el cortafuegos.
    network_mode: host
    volumes:
      - ./despliegue/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  copias:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASS:?hace falta --env-file .env.produccion}
    volumes:
      - ./copias:/copias
    # Un pg_dump diario con 14 dias de retencion. Identico al del compose de
    # produccion, que ya esta probado: el `%Y` lleva UN solo porcentaje —con
    # dos, Compose lo deja literal y los respaldos se llaman `wtfuck-%%Y%%m%%d`.
    #
    # Que RESTAURARLO funcione es otra cosa y no se puede automatizar: hay que
    # probarlo a mano una vez, y anotar cuando.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/copias/wtfuck-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U wtfuck wtfuck | gzip > "$$f" && echo "copia: $$f"
          find /copias -name 'wtfuck-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  almacen:
  redisdatos:
