services:
  db:
    image: postgres:17-alpine
    container_name: wtfuck_db
    environment:
      POSTGRES_USER: wtfuck
      POSTGRES_PASSWORD: wtfuck_dev
      POSTGRES_DB: wtfuck
    ports:
      - "5433:5432"
    volumes:
      - wtfuck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfuck -d wtfuck"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Almacen de objetos para multimedia (modulo D).
  #
  # Los archivos NO van a Postgres: un blob de 40 MB por mensaje revienta la
  # base y arruina los backups. Van aqui, cifrados, y en el mensaje viaja solo
  # la URL y la clave.
  #
  # ## Por que SeaweedFS y no MinIO, que es lo que habia
  #
  # Dos razones, y la segunda es la importante.
  #
  # La primera: las imagenes de MinIO se retiraron de los registros publicos.
  # `quay.io/minio/minio:latest` ya no se puede descargar. Aqui seguia
  # funcionando por la cache de Docker -una imagen bajada hace un ano sigue
  # arrancando aunque el registro haya cerrado- y en un equipo limpio, o en el
  # VPS, no. Eso costo una tarde de depuracion en produccion.
  #
  # La segunda: produccion ya corre SeaweedFS. Tener MinIO aqui significaba
  # probar contra un almacen y desplegar contra otro, y en este proyecto esa
  # forma de comprobar -mirar con una herramienta distinta de la real- ya
  # produjo cuatro defectos seguidos. Las pruebas de adjuntos valen justo lo
  # que se parezca esto a lo de alla.
  almacen:
    image: chrislusf/seaweedfs:4.47
    # Fijada, y no `latest`.
    #
    # `latest` significa que el proximo `docker compose pull` puede cambiar el
    # motor de almacenamiento debajo de un despliegue que funciona, sin que
    # nadie lo pida. Ya se vio en esta misma version: la 4.47 empezo a quejarse
    # de una configuracion IAM que antes no pedia -no rompe las credenciales
    # estaticas, pero es exactamente el tipo de cambio que aparece solo-.
    #
    # Para subirla: cambiar el numero aqui, levantar en local, y correr
    # `node pruebas/correr.mjs media historias` antes de tocar el VPS.
    container_name: wtfuck_almacen
    command:
      # `/data` y NO otra ruta: la imagen declara ese path como su volumen y lo
      # deja en propiedad del usuario `seaweed`, con el que acaba corriendo el
      # proceso. Con cualquier otra, Docker crea el volumen en propiedad de
      # root y el arranque muere con `permission denied`.
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:9000"
    volumes:
      - wtfuck_almacen:/data
      # Las credenciales de desarrollo, versionadas y a la vista: este almacen
      # escucha en local y no guarda nada de nadie. Las de produccion las
      # genera despliegue/preparar.sh.
      - ./pruebas/s3-dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Se comprueba que contesto HTTP, no que devolviera 200: sin credenciales
      # la raiz responde 403, y eso ya demuestra que esta vivo. Un `wget -q`
      # daba por muerto al contenedor en ese caso, porque BusyBox sale con
      # codigo distinto de cero ante cualquier respuesta de error.
      test: ["CMD-SHELL", "wget -O- http://127.0.0.1:9000/ 2>&1 | grep -q HTTP"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Bus entre instancias (modulo N).
  #
  # OPCIONAL: con una sola instancia el servidor no lo usa y arranca igual.
  # Hace falta cuando hay dos o mas procesos detras de un balanceador, porque
  # los sockets viven en la memoria de cada uno: sin bus, un mensaje para
  # alguien conectado a la instancia B no llega si lo manda alguien conectado a
  # la A. Ver server/.../Bus.kt.
  #
  # No lleva volumen a proposito: aqui no se guarda nada que haga falta
  # sobrevivir a un reinicio. Lo que pasa por Redis son avisos en vuelo -sobres
  # ya cifrados, que ademas estan en la base- y marcas de presencia que vencen
  # en 90 segundos. Un Redis vacio tras un reinicio es correcto.
  redis:
    image: redis:8-alpine
    container_name: wtfuck_redis
    command: redis-server --save "" --appendonly no
    ports:
      # Solo loopback. El bus es un canal de CONTROL entre instancias: lo que
      # pasa por el son avisos que el cliente obedece. Publicarlo en todas las
      # interfaces convierte cualquier cosa de la red en algo que puede
      # escribirle al bus. En produccion va en red privada y con contrasena;
      # aqui, atado a 127.0.0.1.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wtfuck_pgdata:
  wtfuck_almacen:
