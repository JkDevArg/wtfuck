[package]
name = "wtfuck-cripto"
version = "0.1.0"
edition = "2024"
# libsignal es AGPL-3.0: todo lo que lo enlaza hereda la licencia.
license = "AGPL-3.0-only"
publish = false
description = "libsignal-protocol para el cliente web de wtfuck, compilado a WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# La MISMA version que usa la app Android (gradle/libs.versions.toml,
# `libsignal`). Dos versiones distintas pueden no entenderse: el formato de
# sesion y el ratchet poscuantico cambian entre versiones.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.86.5" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
uuid = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }

# El azar en el navegador sale de `crypto.getRandomValues`. Sin esto, getrandom
# no compila para wasm32-unknown-unknown: no sabe de donde sacarlo.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

# El mismo parche que aplica el workspace de libsignal. Un parche del workspace
# de una dependencia NO llega a quien la usa: hay que repetirlo aqui.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
