# Lo que hay que anadir al vhost de nginx cuando el panel ya es dueno del
# 80/443 (CloudPanel, Plesk, aaPanel).
#
# =====================================================================
#  LEE ESTO ANTES DE PEGAR NADA
# =====================================================================
#
# CloudPanel, al crear un sitio de tipo "Reverse Proxy", YA ESCRIBE un bloque
# `location / { proxy_pass ...; }`. Si pegas otro debajo, nginx no arranca:
#
#     nginx: [emerg] duplicate location "/" in /etc/nginx/sites-enabled/...
#
# Asi que esto NO son bloques para pegar enteros: son LINEAS QUE VAN DENTRO
# del `location /` que el panel ya creo. Se abre el Vhost Editor, se busca ese
# bloque, y se pegan dentro — dejando el `proxy_pass` que ya esta.
#
# Cada linea tapa un fallo concreto de esta app, y cuatro de ellos dan
# sintomas que no se parecen a su causa. No es relleno defensivo.


# =====================================================================
#  SITIO 1 — apiwtf.TU-DOMINIO       (Reverse Proxy -> http://127.0.0.1:8300)
# =====================================================================
#
# Dentro del `location /` que ya existe, junto al proxy_pass:

    proxy_http_version 1.1;

    # --- El WebSocket -------------------------------------------------
    #
    # Sin estas dos lineas la conexion se queda en HTTP normal y el socket
    # NUNCA se establece. Los mensajes se quedan "enviando" para siempre y no
    # hay ningun error en ningun log: el servidor no ve nada raro y el
    # telefono tampoco. Es el fallo mas caro de diagnosticar de esta lista.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- La IP de quien llama -----------------------------------------
    #
    # Sin esto, TODAS las sesiones y eventos de seguridad quedan grabados con
    # 127.0.0.1. El limite de intentos fallidos por IP cuenta a todo el mundo
    # como una sola persona: cinco personas equivocandose de contrasena
    # bloquean a la sexta.
    #
    # CloudPanel suele poner ya algunas de estas; si estan, no pasa nada por
    # repetirlas —gana la ultima— pero conviene no duplicar por limpieza.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- El tiempo de espera ------------------------------------------
    #
    # El servidor manda un ping cada 20 s y el cliente corta a los 40. El
    # valor por defecto de nginx es 60 s, que parece de sobra y no lo es: una
    # conversacion tranquila corta la conexion sola cada minuto y la app
    # reconecta sin parar. Se nota como bateria que se va.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;


# =====================================================================
#  SITIO 2 — mediawtf.TU-DOMINIO     (Reverse Proxy -> http://127.0.0.1:9000)
# =====================================================================
#
# En su PROPIO dominio y no en una ruta del anterior, y es una razon de
# seguridad: lo que se sirve son archivos subidos por gente. En el mismo
# origen que la API, un archivo servido con el tipo equivocado se ejecuta con
# los permisos de ese origen. En otro dominio, no.
#
# Dentro de su `location /`:

    proxy_http_version 1.1;

    # --- ESTA ES LA IMPORTANTE ----------------------------------------
    #
    # `Host` TIENE que ser el dominio publico. La firma SigV4 de las URLs del
    # almacen incluye el header Host: si nginx lo reescribe a 127.0.0.1:9000
    # —que es lo que hace POR DEFECTO— la firma deja de cuadrar y el almacen
    # responde 403 a todo.
    #
    # Sintoma: el texto va perfecto y SOLO fallan las fotos, los videos y los
    # audios, con "No se pudo subir el archivo". Parece un problema de la
    # funcion de adjuntos y es una linea del proxy.
    proxy_set_header Host $host;

    # --- Sin limite de tamano -----------------------------------------
    #
    # El valor por defecto de nginx es 1 MB, asi que cualquier foto de un
    # telefono de hoy se rechaza con un 413 antes de llegar al almacen. Quien
    # manda los limites de verdad es el servidor, que ya los aplica al
    # reservar el adjunto.
    client_max_body_size 0;

    # Subir 60 MB por datos moviles tarda mas de los 60 s por defecto.
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # Que nada de aqui se interprete como pagina, pase lo que pase.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;


# =====================================================================
#  DESPUES DE GUARDAR, SIEMPRE
# =====================================================================
#
#     nginx -t && systemctl reload nginx
#
# `nginx -t` primero y no despues. Si la configuracion esta mal, nginx se
# queda con la anterior y todo lo demas de la maquina sigue funcionando. Si
# recargas sin comprobar, se cae todo lo que sirve ese nginx — incluido lo que
# ya tenias ahi antes.
