# Para pegar en CloudPanel (o cualquier nginx) cuando el panel ya es dueno del
# 80/443. Son DOS sitios, uno por dominio.
#
# En CloudPanel: crear cada uno como sitio "Reverse Proxy", sacarle el
# certificado con su boton de Let's Encrypt, y pegar esto en
# Vhost > Vhost Editor, dentro del bloque `server` del 443.
#
# Lo que sigue no es una plantilla generica: cada bloque tapa un fallo
# concreto de esta app, y tres de ellos dan sintomas que no se parecen a su
# causa.


# =========================================================== api.TU-DOMINIO
#
#   Reverse Proxy -> http://127.0.0.1:8300

location / {
    proxy_pass http://127.0.0.1:8300;
    proxy_http_version 1.1;

    # --- TRAMPA 1: el WebSocket ---------------------------------------
    #
    # Sin estas dos lineas, la conexion se queda en HTTP normal y el socket
    # NUNCA se establece. Los mensajes siguen "enviando" para siempre y no
    # hay ningun error en ningun log: el servidor no ve nada raro y el
    # telefono tampoco. Es el fallo mas caro de diagnosticar de esta lista.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- TRAMPA 2: la IP de quien llama --------------------------------
    #
    # Sin esto, TODAS las sesiones y eventos de seguridad quedan grabados
    # con 127.0.0.1. El limite de intentos fallidos por IP cuenta a todo el
    # mundo como una sola persona: cinco personas equivocandose de
    # contrasena bloquean a la sexta.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- TRAMPA 3: el tiempo de espera ---------------------------------
    #
    # El servidor manda un ping cada 20 s y el cliente corta a los 40. El
    # valor por defecto de nginx es 60 s, que parece de sobra y no lo es:
    # una conversacion tranquila corta la conexion sola cada minuto y la
    # app reconecta sin parar. Se nota como bateria que se va.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
}


# ========================================================= media.TU-DOMINIO
#
#   Reverse Proxy -> http://127.0.0.1:9000
#
# En su PROPIO dominio y no en una ruta del anterior, y es una razon de
# seguridad: lo que se sirve son archivos subidos por gente. En el mismo
# origen que la API, un archivo servido con el tipo equivocado se ejecuta con
# los permisos de ese origen. En otro dominio, no.

location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;

    # --- TRAMPA 4, y esta es la peor -----------------------------------
    #
    # `Host` TIENE que ser el dominio publico. La firma SigV4 de las URLs
    # del almacen incluye el header Host: si nginx lo reescribe a
    # `127.0.0.1:9000` —que es lo que hace POR DEFECTO— la firma deja de
    # cuadrar y el almacen responde 403 a todo.
    #
    # Sintoma: el texto va perfecto y SOLO fallan las fotos, los videos y
    # los audios, con "No se pudo subir el archivo". Parece un problema de
    # la funcion de adjuntos y es una linea del proxy.
    proxy_set_header Host $host;

    # Sin limite de tamano.
    #
    # El valor por defecto de nginx es 1 MB, asi que cualquier foto de un
    # telefono de hoy se rechaza con un 413 antes de llegar al almacen.
    # Quien manda los limites de verdad es el servidor, que ya los aplica
    # al reservar el adjunto.
    client_max_body_size 0;

    # Subir 60 MB por datos moviles tarda mas de los 60 s por defecto.
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # Que nada de aqui se interprete como pagina, pase lo que pase.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}
