# coturn para las llamadas.
#
# Dos telefonos detras de NAT no se ven, y con NAT simetrico —lo normal en una
# red movil— ICE no consigue ruta directa. Sin esto, una llamada entre dos
# personas en redes distintas no conecta.
#
# El relevo NO rompe el cifrado: coturn mueve paquetes DTLS-SRTP que no puede
# abrir. Un TURN comprometido aprende metadatos —que hubo una llamada, cuanto
# duro, cuanto trafico— pero no contenido.

# --- credenciales ---------------------------------------------------------
#
# Esquema REST: el servidor emite usuario `<vencimiento>:<algo>` y clave
# `base64(HMAC-SHA1(secreto, usuario))`, que caduca en horas. Asi no hay
# usuarios fijos de TURN que alguien pueda extraer del APK y usar de proxy
# gratis — que es lo que pasa con `user=`/`password=` fijos.
use-auth-secret
static-auth-secret=CAMBIAR_debe_ser_igual_a_WTFUCK_TURN_SECRETO
realm=CAMBIAR.ejemplo.com

# --- red ------------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# La IP publica de la maquina. Hace falta explicita: detras de un NAT de
# proveedor —una VPS con IP flotante, AWS, GCP— coturn anuncia la privada y
# los candidatos que reparte no sirven para nada.
# external-ip=CAMBIAR_IP_PUBLICA

# El rango de puertos de relevo. Tiene que estar abierto en el cortafuegos en
# UDP; es lo que se olvida y deja las llamadas conectando para siempre.
min-port=49160
max-port=49200

# --- lo que NO se permite -------------------------------------------------
#
# Un TURN abierto es un proxy abierto: se usa para atacar a terceros desde tu
# IP, y para alcanzar servicios de tu propia red privada desde internet. Estas
# lineas son las que lo evitan, y son la parte que mas se omite.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Sin consola de administracion: es una superficie mas y no se usa.
no-cli

# Un tope por sesion. El ancho de banda del relevo es el costo real de esto:
# una videollamada relevada son unos 2 Mbit/s en cada sentido.
user-quota=12
total-quota=1200

fingerprint
stale-nonce=600
