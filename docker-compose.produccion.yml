# Todo lo que hace falta para que esto salga a internet, en una maquina.
#
#   docker compose -f docker-compose.produccion.yml up -d
#
# Antes: copiar `.env.produccion.ejemplo` a `.env.produccion` y rellenarlo.
# Ver docs/09-DESPLIEGUE.md.
#
# ## La regla que ordena este archivo
#
# **Solo Caddy y coturn tocan internet.** Postgres, Redis, MinIO y el propio
# servidor no publican ni un puerto: se hablan por la red interna de Docker y
# no existen desde fuera.
#
# En el compose de desarrollo Postgres sale en el 5433 y MinIO en el 9000
# porque ahi es comodo. Copiar eso a un servidor publico es como se regalan las
# bases de datos: un Postgres con contrasena escuchando en 0.0.0.0 lo encuentra
# un escaner en horas, no en meses.
#
# Redis importa mas de lo que parece desde el modulo AP: ahi viven los
# contadores de intentos fallidos de ingreso. Quien pueda escribirle borra el
# limite de fuerza bruta. Por eso lleva contrasena Y se queda sin publicar.

# ATENCION AL --env-file
#
#   docker compose --env-file .env.produccion -f <este archivo> up -d
#
# La bandera NO es opcional. `env_file:` de abajo inyecta variables DENTRO de
# los contenedores, pero las `${VARIABLES}` de este archivo las resuelve
# Compose ANTES, y para eso solo mira `.env` o lo que diga `--env-file`.
#
# Sin la bandera, Compose avisa con un WARN facil de pasar por alto y sigue
# con cadenas vacias: un Postgres sin contrasena y un almacen con credenciales
# en blanco. Por eso cada variable lleva `:?` — asi Compose se PARA con un
# mensaje que dice cual falta, en vez de levantar algo abierto.

name: wtfuck

services:

  # ----------------------------------------------------------------- TLS
  #
  # Caddy y no nginx por una razon concreta: saca y renueva el certificado de
  # Let's Encrypt solo, sin cron, sin certbot y sin que nadie se acuerde de
  # renovar en 89 dias. El `Caddyfile` son ocho lineas.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data      # los certificados viven aqui: NO borrar
      - caddy_config:/config
    environment:
      DOMINIO_API: ${DOMINIO_API:?hace falta --env-file .env.produccion}
      DOMINIO_MEDIA: ${DOMINIO_MEDIA:?hace falta --env-file .env.produccion}
    depends_on:
      - servidor

  # -------------------------------------------------------------- el servidor
  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.produccion
    environment:
      WTFUCK_PUERTO: 8300
      WTFUCK_DB_URL: jdbc:postgresql://db:5432/wtfuck
      WTFUCK_REDIS_URL: redis://:${REDIS_PASS:?hace falta --env-file .env.produccion}@redis:6379
      # El interruptor mas importante de todo el despliegue.
      #
      # En `true` se aceptan aparatos sin enclave seguro, o sea emuladores, y
      # el vinculo de hardware —"una cuenta por dispositivo"— se salta con un
      # emulador y cinco minutos. Va explicito aqui y no por defecto para que
      # se vea al leer el archivo.
      WTFUCK_PERMITIR_SOFTWARE_DEV: "false"
      # El almacen tiene dos direcciones y no una: la interna para hablar con
      # el, y la publica para FIRMAR lo que ve el telefono. Ver la nota de
      # `WTFUCK_S3_PUBLICO` en `.env.produccion.ejemplo`; con una sola, los
      # adjuntos no funcionan en produccion.
      WTFUCK_S3_PUBLICO: https://${DOMINIO_MEDIA:?hace falta --env-file .env.produccion}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      almacen:
        condition: service_healthy
    # Sin `ports`. Caddy lo alcanza por la red interna.

  # ------------------------------------------------------------------ base
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtfuck
      POSTGRES_PASSWORD: ${DB_PASS:?hace falta --env-file .env.produccion}
      POSTGRES_DB: wtfuck
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Las copias caen aqui; ver el servicio `copias`.
      - ./copias:/copias
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfuck -d wtfuck"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- redis
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Sin persistencia, igual que en desarrollo: lo que pasa por aqui son
    # avisos en vuelo y marcas de presencia que vencen en 90 segundos.
    #
    # Los contadores de intentos fallidos tambien viven aqui y tambien es
    # correcto que se pierdan en un reinicio del CONTENEDOR: lo que el modulo
    # AP vino a arreglar era que se perdieran al reiniciar el SERVIDOR, que es
    # lo que pasa en cada despliegue. Redis se reinicia casi nunca.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASS:?hace falta --env-file .env.produccion}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:?hace falta --env-file .env.produccion}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- media
  # ------------------------------------------------------------- almacen
  #
  # SeaweedFS y no MinIO, y no por gusto: MinIO retiro la imagen del servidor
  # de los registros publicos. `quay.io/minio/minio` devuelve 401 hasta para
  # consultar el repositorio, `minio/minio` ya no existe en Docker Hub —la
  # organizacion conserva 20 repos y ese no esta— y ni ghcr ni ECR la tienen.
  #
  # Se descubrio de la peor forma posible: funcionando en la maquina de
  # desarrollo, donde la imagen llevaba un ano en cache, y fallando en un
  # servidor nuevo que si tenia que descargarla. Docker no vuelve a bajar lo
  # que ya tiene, asi que un registro que se cierra es invisible hasta que
  # alguien empieza de cero. Es un argumento para fijar versiones y guardar
  # copia de las imagenes de las que uno depende.
  #
  # SeaweedFS habla S3 con firmas SigV4, que es lo unico que esta app le pide
  # a un almacen. Verificado con las 1548 pruebas de integracion, que suben y
  # bajan adjuntos por URL firmada: pasan las mismas que pasaban con MinIO.
  #
  # Las credenciales van en `despliegue/s3.json` —SeaweedFS no las toma por
  # variable de entorno— y las escribe `despliegue/preparar.sh`.
  almacen:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - server
      - -dir=/datos
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - almacen:/datos
      - ./despliegue/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Se comprueba que el S3 CONTESTO con HTTP, no que devolviera 200.
      #
      # Sin credenciales la raiz responde 403, y eso ya demuestra que el
      # servicio esta vivo. El `wget -q -O-` que habia aqui antes daba por
      # muerto al contenedor en ese caso: BusyBox devuelve distinto de cero
      # ante cualquier respuesta de error, asi que el almacen nunca llegaba a
      # `healthy` y el servidor se quedaba esperandolo para siempre.
      #
      # Lo escribi mirando `curl -w "%{http_code}"`, que devuelve 0 pase lo
      # que pase, y de ahi salio la suposicion equivocada.
      #
      # Comprobado en la imagen, en los dos sentidos: da 0 contra el S3 vivo
      # y falla contra un puerto donde no hay nadie. Un chequeo que no puede
      # fallar no comprueba nada.
      test: ["CMD-SHELL", "wget -O- http://127.0.0.1:9000/ 2>&1 | grep -q HTTP"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ TURN
  #
  # `network_mode: host` y no puertos publicados, a proposito.
  #
  # coturn necesita un rango de miles de puertos UDP para los relevos.
  # Publicarlos uno a uno hace que Docker levante un proxy por puerto y la
  # maquina se cae sola al arrancar. Con red de anfitrion, coturn ve las
  # direcciones reales, que ademas es lo que ICE necesita para funcionar.
  #
  # Es el unico servicio con red de anfitrion, y por eso su configuracion es
  # la unica que tiene que traer sus propias reglas.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./despliegue/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # ---------------------------------------------------------------- copias
  #
  # Un `pg_dump` diario comprimido, con 14 dias de retencion.
  #
  # Va en el compose y no en un cron del anfitrion porque un respaldo que
  # depende de que alguien se acuerde de configurarlo aparte es un respaldo que
  # no existe. Que **restaurarlo** funcione es otra cosa y no se puede
  # automatizar: hay que probarlo a mano una vez, y anotar cuando.
  copias:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASS:?hace falta --env-file .env.produccion}
    volumes:
      - ./copias:/copias
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/copias/wtfuck-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U wtfuck wtfuck | gzip > "$$f" && echo "copia: $$f"
          find /copias -name 'wtfuck-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  almacen:
  caddy_datos:
  caddy_config:
