## wtfuck - configuracion de build

# JDK 21 LTS explicito. En esta maquina el java del PATH es 25 y JAVA_HOME puede
# apuntar a un JDK non-LTS. Kotlin no reconoce jvmTarget=25 y degrada en silencio.
org.gradle.java.home=C\:/Program Files/Java/jdk-21.0.11

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
